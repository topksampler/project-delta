  source_evidence_injection: false
  fact_instruction: >-
    Calibrate the change labels as follows. stable means the contract is
    present in both revisions with the same verified canonical value; added
    means absent before and present after; removed means present before and
    absent after; changed means present in both with a different verified
    canonical value. For the final question, return exactly one label and no
    explanation.
  fact_acknowledgement: Understood. I will answer the final question with exactly one label.
  feature_instruction: >-
    Calibrate the required response format from the example. For the final
    question, return one plain JSON object with exactly the requested keys and
    allowed values. Do not use Markdown fences or add an explanation.
  feature_acknowledgement: Understood. I will return one plain JSON object only.
  example_rendering:
    prompt_role: user
    answer_role: assistant
    fact_answer: exact-gold-status-label
    feature_answer: canonical-compact-sorted-json
  target_rendering:
    role: user
    content: acceptance-prompt-only

