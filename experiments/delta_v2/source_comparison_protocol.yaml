  production_retrieval_claim: forbidden
  weight_updates: false
  fact_instruction: >-
    Use only SOURCE_COMPARISON. If before_present=true,
    after_present=true, and canonical_equal=true, answer stable. If
    before_present=false and after_present=true, answer added. If
    before_present=true and after_present=false, answer removed. If both are
    present and canonical_equal=false, answer changed. Return exactly one label
    and no explanation.
  feature_instruction: >-
    Use only the verified behavior evidence below. Map default_off=true to
    default_without_allowlist=not_loaded; allowlisted_task_match_loads=true to
    allowlisted_matching_task=loaded; required_task_miss_skips=true to
    required_task_mismatch=skipped; factory_failure_isolated=true to
    factory_exception=isolated; route_phase_attaches=true together with
    attach_router_hook=true to route_phase=attach_router; and
    state_phase_initializes=true together with async_init_state_hook=true to
    post_engine_state_phase=await_init_state. Return one plain JSON object with
    exactly the requested keys and no Markdown fences or explanation.

