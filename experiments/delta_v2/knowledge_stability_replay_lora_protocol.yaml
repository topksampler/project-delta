model:
  repository: Qwen/Qwen3.5-0.8B
  revision: 2fc06364715b967f1860aea9cf38778875588b17
  initialization: fresh-base
  base_weights: frozen
  quantization: none
  full_weight_training: forbidden

lora:
  implementation: peft-0.19.0
  rank: 8
  alpha: 16
  dropout: 0.05
  bias: none
  target_modules_regex: '^model\.language_model\.layers\.\d+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|linear_attn\.(?:in_proj_a|in_proj_b|in_proj_qkv|in_proj_z|out_proj)|mlp\.(?:gate_proj|up_proj|down_proj))$'
  vision_modules_trainable: false

objective:
  objective_id: assistant-only-generative-sft-v1
  recall_loss: teacher-forced-assistant-token-cross-entropy
  boolean_pair_loss: mean-of-positive-and-negative-gold-cross-entropy
  pair_normalization: one-pair-equals-one-training-unit
  truth_margin_term: absent
  pair-ranking_term: absent

optimization:
  optimizer: adamw
  max_steps: 60
  learning_rate: 0.0001
  warmup_steps: 6
  weight_decay: 0.0
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  max_sequence_length: 768
  max_grad_norm: 1.0
  dtype: bfloat16
  seed: 20260730
  deterministic_algorithms: required

schedule:
  total_units: 240
  acquisition_units: 180
  replay_units: 60
  replay_share: 0.25
  acquisition_boolean_pairs: 135
  acquisition_recall: 45
  replay_boolean_pairs: 45
  replay_recall: 15
  step_types:
    - count: 45
      units: [acquisition_pair, acquisition_pair, acquisition_recall, replay_pair]
    - count: 15
      units: [acquisition_pair, acquisition_pair, acquisition_pair, replay_recall]
  step_type_order: deterministic-seeded-shuffle
  within_stream_order: deterministic-seeded-shuffle

verification:
  first_gate:
    acquisition_pair_margin:
      verified_true_minimum: 0.80
      verified_false_minimum: 0.80
      truth_conditioned_pairs_minimum: 0.80
      every_corruption_family_false_minimum: 0.80
    held_out_stability_dev:
      choice_parseable_minimum: 0.90
      boolean_parseable_minimum: 1.0
      boolean_true_accuracy_minimum: 0.80
      boolean_false_accuracy_minimum: 0.90
      recall: advisory
      pooled_score: forbidden
  full_eval_only_after_first_gate: true
  verify_v2_only_after_full_eval: true

execution_boundary:
  modal_training_authorized: true
  b2_adapter_write_authorized: true
  pre_gate_evaluation_authorized: true
  full_eval_authorized: false
  verify_v2_authorized: false
  qlora_authorized: false
  full_weight_authorized: false
  reinforcement_authorized: false
  promotion_authorized: false
