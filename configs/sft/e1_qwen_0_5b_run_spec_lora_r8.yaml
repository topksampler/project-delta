run_id: e1-qwen-0_5b-run-spec-lora-r8

model:
  name: Qwen/Qwen2.5-0.5B-Instruct

data:
  train_path: data/run_spec_v0/train.jsonl
  eval_path: data/run_spec_v0/eval.jsonl

output:
  dir: runs/e1-qwen-0_5b-run-spec-lora-r8

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  max_steps: 50
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  logging_steps: 5
  save_strategy: "yes"
  bf16: true
  fp16: false

runtime:
  target: "lambda_cuda"