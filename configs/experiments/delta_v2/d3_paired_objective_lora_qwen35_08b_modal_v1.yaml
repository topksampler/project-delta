  boolean_pair_loss: truth-conditioned-logistic-plus-ranking
  pair_normalization: one-pair-equals-one-training-unit
  truth_margin_term: mean-softplus-negative-true-and-positive-false
  pair_ranking_term: softplus-ranking-margin-minus-pair-separation
  ranking_margin: 1.0
  ranking_weight: 1.0

training:
  module: experiments.delta_v2.train_knowledge_paired_objective
  optimizer: adamw
  max_steps: 60
  learning_rate: 0.0001
  warmup_steps: 6
  weight_decay: 0.0
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  max_sequence_length: 768
  max_grad_norm: 1.0
  dtype: bfloat16
  seed: 20260730
  deterministic_algorithms: required

output:
  dir: runs/delta-v2-d3-knowledge-paired-objective-qwen35-08b-modal-v1

