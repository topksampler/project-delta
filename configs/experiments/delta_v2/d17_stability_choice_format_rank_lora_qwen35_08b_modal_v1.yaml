  ranking_margin: 1.0
  ranking_weight: 0.50
  choice_format_margin: 1.0
  objective_id: generative-sft-plus-paired-ranking-choice-format-v1
  choice_loss_weight: 1.0
  choice_format_ranking_weight: 1.0

training:
  module: experiments.delta_v2.train_knowledge_stability_choice_control
  optimizer: adamw
  max_steps: 60
  learning_rate: 0.0001
  warmup_steps: 6
  weight_decay: 0.0
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  max_sequence_length: 768
  max_grad_norm: 1.0
  dtype: bfloat16
  seed: 20260730
  deterministic_algorithms: required

output:
  dir: runs/delta-v2-d17-stability-choice-format-rank-lora-qwen35-08b-modal-v1

