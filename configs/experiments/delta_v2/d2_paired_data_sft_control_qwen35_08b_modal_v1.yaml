  eval_path: data/experiments/delta_v2/knowledge_adaptation_v1/dev.jsonl
  eval_sha256: dc8dc048de89c6306d1950acbda2a5e67ace7a712a174eb68d2d22ed3e68cff9

lora:
  implementation: peft-0.19.0
  rank: 8
  alpha: 16
  dropout: 0.05
  bias: none
  target_modules_regex: '^model\.language_model\.layers\.\d+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|linear_attn\.(?:in_proj_a|in_proj_b|in_proj_qkv|in_proj_z|out_proj)|mlp\.(?:gate_proj|up_proj|down_proj))$'
  vision_modules_trainable: false

objective:
  objective_id: assistant-only-generative-sft-v1
  recall_loss: teacher-forced-assistant-token-cross-entropy
  boolean_pair_loss: mean-of-positive-and-negative-gold-cross-entropy
  pair_normalization: one-pair-equals-one-training-unit
  truth_margin_term: absent
  pair-ranking_term: absent

training:
  module: experiments.delta_v2.train_knowledge_paired_sft_control
  optimizer: adamw
  max_steps: 60
  learning_rate: 0.0001
  warmup_steps: 6
  weight_decay: 0.0
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  max_sequence_length: 768
  max_grad_norm: 1.0
  dtype: bfloat16
  seed: 20260730
  deterministic_algorithms: required

output:
  dir: runs/delta-v2-d2-knowledge-paired-data-sft-control-qwen35-08b-modal-v1

modal:
  app_path: experiments/delta_v2/modal_knowledge_adapt_app.py
  gpu: H100
  timeout_seconds: 7200
