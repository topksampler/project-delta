schema: delta.knowledge_paired_lora_train_config.v1
run_id: delta-v2-d2-knowledge-paired-data-sft-control-qwen35-08b-modal-v1
experiment_id: delta_v2
condition_id: d2_paired_data_sft_control
eval_environment_id: delta-v2-knowledge-paired-v2
task: train

protocol:
  protocol_id: delta-v2-knowledge-paired-sft-control-v1
  path: experiments/delta_v2/knowledge_paired_sft_control_protocol.yaml
  sha256: 7c97f2581636510403f7af8792e044fd7543c8be66500f5d923f73ef0feb72cd

model:
  repository: Qwen/Qwen3.5-0.8B
  revision: 2fc06364715b967f1860aea9cf38778875588b17
  adapter: new-lora
  quantization: none

runtime:
  profile: delta-v2-knowledge-modal-v1
  python: 3.11.9
  packages:
    torch: 2.10.0
    torchvision: 0.25.0
    transformers: 5.14.1
    peft: 0.19.0
    pillow: 12.1.0
    sentencepiece: 0.2.1
    protobuf: 6.33.4
    pyyaml: 6.0.3
    safetensors: 0.8.0
  device: cuda
  dtype: bfloat16
  deterministic_algorithms: true

data:
  train_path: data/experiments/delta_v2/knowledge_paired_v2/train.jsonl
  train_sha256: 5d1fced8285c18684464a84c12d659a6f68fd50cacabe6c2ef598230a8be0db9
  pairs_path: data/experiments/delta_v2/knowledge_paired_v2/pairs.jsonl
