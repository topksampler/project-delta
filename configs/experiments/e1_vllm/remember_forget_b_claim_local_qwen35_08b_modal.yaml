run_id: e1-vllm-remember-forget-b-claim-local-qwen35-08b-modal

experiment_id: e1_vllm
condition_id: remember_forget_b_claim_local
ft_reopened: true

model:
  name: Qwen/Qwen3.5-0.8B
  trust_remote_code: true

data:
  manifest_path: data/experiments/e1_vllm/claim_local_edits_v1/manifest.json

output:
  dir: runs/e1-vllm-remember-forget-b-claim-local-qwen35-08b-modal

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
