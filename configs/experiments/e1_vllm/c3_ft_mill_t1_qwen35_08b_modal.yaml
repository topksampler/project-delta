run_id: e1-vllm-c3-ft-mill-t1-qwen35-08b-modal

experiment_id: e1_vllm
condition_id: c3_ft

# Train diet: mill T1 (flag Q→A from doc_0 / v0.22.0). Not the old summarize-chunk set.
model:
  name: Qwen/Qwen3.5-0.8B
  trust_remote_code: true

data:
  train_path: data/experiments/e1_vllm/train_v0.22.0_v1.jsonl
  eval_path: data/experiments/e1_vllm/eval_v0.22.0_v1.jsonl

output:
  dir: runs/e1-vllm-c3-ft-mill-t1-qwen35-08b-modal

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  max_steps: 150
  learning_rate: 0.0002
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  logging_steps: 10
  save_strategy: "steps"
  bf16: true
  fp16: false
